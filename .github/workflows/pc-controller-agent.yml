name: pc-controller agent (Windows .exe)

on:
  push:
    branches: [main]
    paths:
      - 'pc-controller/agent/**'
      - 'pc-controller/src/crypto.ts'
      - 'pc-controller/scripts/crypto-vector.mjs'
      - '.github/workflows/pc-controller-agent*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pc-controller/agent/**'
      - 'pc-controller/src/crypto.ts'
      - 'pc-controller/scripts/crypto-vector.mjs'
      - '.github/workflows/pc-controller-agent*.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-controller/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'pc-controller/.nvmrc'
      - name: Self-test (includes a cross-check with the phone app's crypto)
        run: |
          dotnet build -c Release
          $t = "$env:RUNNER_TEMP/selftest"
          node ../scripts/crypto-vector.mjs make $t
          $p = Start-Process bin/Release/net8.0-windows/PcControllerAgent.exe -ArgumentList '--selftest','--vector',"$t/vector.json",'--data-dir',$t -Wait -PassThru
          Get-Content "$t/selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
          node ../scripts/crypto-vector.mjs verify $t
      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: PcControllerAgent
          path: pc-controller/agent/publish/PcControllerAgent.exe
          if-no-files-found: error
