<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Agent Office</title>
  </head>
  <body>
    <div id="app">
      <main class="stage-area" id="stage-area">
        <div class="stage" id="stage">
          <canvas id="office" aria-label="Pixel office"></canvas>
          <div id="tooltip" class="tooltip hidden"></div>

          <div id="dialog" class="dialog hidden" role="dialog" aria-live="polite">
            <canvas id="dlg-portrait" class="portrait"></canvas>
            <div class="dlg-main">
              <div class="dlg-name" id="dlg-name"></div>
              <div class="dlg-text" id="dlg-text"></div>
              <div class="dlg-choices" id="dlg-choices"></div>
              <form class="dlg-form" id="dlg-form" autocomplete="off">
                <input id="dlg-input" type="text" maxlength="400" />
                <button type="submit" class="btn primary">Send</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Floating HUD: tiny, so the office gets the whole window -->
        <div class="hud hud-left">
          <span class="logo" aria-hidden="true"></span>
          <h1>AGENT OFFICE</h1>
          <span id="job-title" class="job-title">No active job &mdash; press Start or click Rex</span>
          <ol id="steps" class="steps" aria-label="Workflow progress"></ol>
        </div>
        <div class="hud hud-right">
          <button id="btn-start" class="btn primary" type="button">Start job</button>
          <button id="btn-panels" class="btn" type="button" aria-expanded="false" aria-controls="drawer">Menu</button>
        </div>

        <aside class="drawer" id="drawer" aria-label="Controls and details">
          <section class="panel" aria-label="Controls">
            <h2>Controls</h2>
            <div class="ctl-row">
              <button id="btn-reset" class="btn" type="button">Reset</button>
              <label class="check"><input id="auto" type="checkbox" /> Auto-answer</label>
            </div>
            <div class="ctl-row" role="group" aria-label="Simulation speed">
              <span class="label">SPEED</span>
              <button class="btn speed active" data-speed="1" type="button">1x</button>
              <button class="btn speed" data-speed="2" type="button">2x</button>
              <button class="btn speed" data-speed="4" type="button">4x</button>
              <button class="btn speed" data-speed="8" type="button">8x</button>
            </div>
            <div class="ctl-row" role="group" aria-label="Camera">
              <span class="label">VIEW</span>
              <button id="btn-zoom-out" class="btn" type="button" title="Zoom out (-)">&minus;</button>
              <button id="btn-zoom-in" class="btn" type="button" title="Zoom in (+ or mouse wheel)">+</button>
              <button id="btn-zoom-fit" class="btn" type="button" title="See the whole building (0)">Fit</button>
            </div>
            <p class="hint">Zoom in, then look around: mouse to the screen edge, WASD / arrow keys, or drag.</p>
            <div class="ctl-row">
              <span class="label">TRY</span>
              <button id="btn-reject" class="btn" type="button" title="The next QA review sends the work back once">QA reject</button>
              <button id="btn-error" class="btn" type="button" title="Crash a working staff member">Agent error</button>
              <button id="btn-jam" class="btn" type="button" title="Drop several memos on the courier">Courier jam</button>
            </div>
          </section>
          <section class="panel" id="inspector" aria-label="Selected character"></section>
          <section class="panel">
            <h2>Courier queue</h2>
            <ul id="queue" class="queue"></ul>
          </section>
          <section class="panel feed-panel">
            <h2>Event feed</h2>
            <ul id="feed" class="feed"></ul>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
