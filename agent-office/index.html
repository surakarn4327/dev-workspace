<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Agent Office</title>
  </head>
  <body>
    <!-- All words come from src/core/strings.ts via data-i18n* attributes (applied by ui/i18n-dom.ts). -->
    <div id="app">
      <main class="stage-area" id="stage-area">
        <div class="stage" id="stage">
          <canvas id="office" data-i18n-aria="canvas.aria"></canvas>
          <div id="tooltip" class="tooltip hidden"></div>

          <div id="dialog" class="dialog hidden" role="dialog" aria-live="polite">
            <button id="dlg-close" class="btn close dlg-close" type="button" data-i18n-aria="ui.close">&times;</button>
            <canvas id="dlg-portrait" class="portrait"></canvas>
            <div class="dlg-main">
              <div class="dlg-name" id="dlg-name"></div>
              <div class="dlg-text" id="dlg-text"></div>
              <div class="dlg-choices" id="dlg-choices"></div>
              <form class="dlg-form" id="dlg-form" autocomplete="off">
                <input id="dlg-input" type="text" maxlength="400" />
                <button type="submit" class="btn primary" data-i18n="dlg.send"></button>
              </form>
            </div>
          </div>
        </div>

        <!-- Floating HUD: tiny, so the office gets the whole window -->
        <div class="hud hud-left">
          <span class="logo" aria-hidden="true"></span>
          <h1>AGENT OFFICE</h1>
          <span id="job-title" class="job-title"></span>
          <ol id="steps" class="steps" data-i18n-aria="steps.aria"></ol>
        </div>
        <div class="hud hud-right">
          <button id="btn-start" class="btn primary" type="button"></button>
          <button id="btn-panels" class="btn" type="button" aria-expanded="false" aria-controls="drawer" data-i18n="hud.menu"></button>
        </div>

        <aside class="drawer" id="drawer" data-i18n-aria="drawer.aria">
          <div class="drawer-head">
            <h2 data-i18n="hud.menu"></h2>
            <button class="btn close" type="button" data-close data-i18n-aria="ui.close">&times;</button>
          </div>
          <section class="panel" data-i18n-aria="controls.title">
            <h2 data-i18n="controls.title"></h2>
            <div class="ctl-row" role="group" data-i18n-aria="lang.aria">
              <span class="label" data-i18n="lang.label"></span>
              <button class="btn lang" data-lang="en" type="button" aria-pressed="false" data-i18n="lang.en"></button>
              <button class="btn lang" data-lang="th" type="button" aria-pressed="false" data-i18n="lang.th"></button>
            </div>
            <div class="ctl-row">
              <button id="btn-reset" class="btn" type="button" data-i18n="btn.reset"></button>
              <label class="check" data-demo><input id="auto" type="checkbox" /> <span data-i18n="auto.answer"></span></label>
            </div>
            <div class="ctl-row" role="group" data-demo data-i18n-aria="speed.aria">
              <span class="label" data-i18n="speed.label"></span>
              <button class="btn speed active" data-speed="1" type="button">1x</button>
              <button class="btn speed" data-speed="2" type="button">2x</button>
              <button class="btn speed" data-speed="4" type="button">4x</button>
              <button class="btn speed" data-speed="8" type="button">8x</button>
            </div>
            <div class="ctl-row" role="group" data-i18n-aria="view.aria">
              <span class="label" data-i18n="view.label"></span>
              <button id="btn-zoom-out" class="btn" type="button" data-i18n-title="view.zoomOut.title">&minus;</button>
              <button id="btn-zoom-in" class="btn" type="button" data-i18n-title="view.zoomIn.title">+</button>
              <button id="btn-zoom-fit" class="btn" type="button" data-i18n-title="view.fit.title" data-i18n="view.fit"></button>
            </div>
            <p class="hint" data-i18n="view.hint"></p>
            <div class="ctl-row" data-demo>
              <span class="label" data-i18n="try.label"></span>
              <button id="btn-reject" class="btn" type="button" data-i18n-title="try.reject.title" data-i18n="try.reject"></button>
              <button id="btn-error" class="btn" type="button" data-i18n-title="try.error.title" data-i18n="try.error"></button>
              <button id="btn-jam" class="btn" type="button" data-i18n-title="try.jam.title" data-i18n="try.jam"></button>
            </div>
          </section>
          <section class="panel" data-i18n-aria="ai.title">
            <h2 data-i18n="ai.title"></h2>
            <div class="ctl-row key-row">
              <input
                id="ai-key"
                type="password"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="ai.keyPlaceholder"
                data-i18n-aria="ai.keyLabel"
              />
            </div>
            <div class="ctl-row">
              <button id="ai-save" class="btn primary" type="button" data-i18n="ai.save"></button>
              <button id="ai-remove" class="btn" type="button" data-i18n="ai.remove"></button>
            </div>
            <p id="ai-status" class="hint" aria-live="polite"></p>
            <p class="hint" data-i18n="ai.hint"></p>
          </section>
          <section class="panel">
            <h2 data-i18n="queue.title"></h2>
            <ul id="queue" class="queue"></ul>
          </section>
          <section class="panel feed-panel">
            <h2 data-i18n="feed.title"></h2>
            <ul id="feed" class="feed"></ul>
          </section>
          <p class="hint credit" data-i18n="credit.font"></p>
        </aside>

        <!-- Shown only when a character is clicked; the menu and this panel never open together -->
        <aside class="drawer card-only" id="char-panel" data-i18n-aria="inspector.title">
          <section class="panel char-card">
            <button class="btn close" type="button" data-close data-i18n-aria="ui.close">&times;</button>
            <div id="inspector"></div>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
