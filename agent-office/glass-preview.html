<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Glass wall looks</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #120f1f;
        color: #ebe7ff;
        font: 14px/1.5 'Cascadia Mono', Consolas, monospace;
      }
      h1 {
        margin: 0 0 4px;
        color: #ffcc4d;
        font-size: 18px;
        letter-spacing: 2px;
      }
      .lead {
        margin: 0 0 18px;
        color: #9a93c2;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(540px, max-content));
        gap: 18px;
      }
      .card {
        background: #1c1830;
        border: 2px solid #3d3569;
        padding: 12px;
        max-width: 560px;
      }
      .card h2 {
        margin: 0 0 8px;
        color: #ffcc4d;
        font-size: 15px;
      }
      .card p {
        margin: 8px 0 0;
        color: #bdb6e6;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h1>GLASS WALL LOOKS</h1>
    <p class="lead">
      Same scene for every look: a desk and a person behind the wall, a double door in the middle, people in
      the corridor in front. Tell me the letter you like (or mix: e.g. "frame of F with the glass of D").
    </p>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/preview/glass-preview.ts"></script>
  </body>
</html>
