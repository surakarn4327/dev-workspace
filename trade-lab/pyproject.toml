[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelab"
version = "0.1.0"
description = "ห้องแล็บวิจัยตลาด M1/M5 — หาว่าแนวคิดเทคนิคไหนทำกำไรได้จริง"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0"]

[project.scripts]
tradelab = "tradelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
    "ignore::pandas.errors.PerformanceWarning",
]
